<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>オッズ一覧</title>
<!--
  オッズ一覧（別ページ）: today.html のレース詳細「オッズ一覧」ボタンから開く。
  /api/odds（2連単30点+2連複15点）+ /api/odds?type=3t（3連単120点）を直取りし全組を表示。
  URLパラメータ: id=12桁race_id(jcd2+YYYYMMDD+rno2) / v=場名 / no=R番 / tm=締切
                 bf=本線2連複(1-4,1-2,…) / b3=本線3連単 / ba=穴予想6点 …AI買い目ハイライト用
                 （b2=旧・本線2連単は2026-07-07の券種切替で廃止・無視）
  約2分毎に自動更新（サーバ側90秒キャッシュ・タブ非表示中はスキップ）。クラウド専用。
-->
<style>
  body{font-family:"Yu Gothic UI",system-ui,sans-serif;margin:0 auto;padding:12px 14px 40px;
       background:#0f1115;color:#e6e6e6;max-width:560px}
  h1{font-size:17px;margin:4px 0 2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .meta{font-size:12px;color:#9aa3b2;margin:0 0 10px}
  .upbtn{margin-left:auto;padding:5px 14px;font-size:12px;font-weight:600;color:#43c59e;
         background:#10231d;border:1px solid #2f6f57;border-radius:8px;cursor:pointer}
  .upbtn:disabled{opacity:.5}
  .sec{font-size:13px;font-weight:600;color:#9aa3b2;margin:18px 0 6px;display:flex;align-items:center;gap:8px}
  .kbadge{font-size:10px;font-weight:600;padding:1px 7px;border-radius:9px;color:#8fa8d0;
          background:#141a26;border:1px solid #2a3852}
  .mc{display:inline-block;width:16px;height:16px;line-height:16px;text-align:center;border-radius:4px;
      font-size:11px;font-weight:700;vertical-align:middle}
  table{border-collapse:collapse;width:100%;font-size:11.5px;table-layout:fixed}
  th{font-weight:600;color:#9aa3b2;padding:3px 1px;border-bottom:1px solid #2a2f3a}
  td{padding:4px 1px;text-align:center;border-bottom:0.5px solid #1c2029;color:#cfd6e1;
     white-space:nowrap;overflow:hidden}
  td .lane{color:#8791a3;font-weight:600;margin-right:2px}
  td.hl2{background:#10231d;box-shadow:inset 0 0 0 1px #2f6f57;border-radius:4px;color:#7fe0bf;font-weight:700}
  td.hl3{background:#10231d;box-shadow:inset 0 0 0 1px #2f6f57;border-radius:4px;color:#7fe0bf;font-weight:700}
  td.hla{background:#1c1526;box-shadow:inset 0 0 0 1px #5a3f8f;border-radius:4px;color:#c79bff;font-weight:700}
  td.na{color:#4a5261}
  .blk{margin:8px 0 14px}
  .crow{display:flex;align-items:center;gap:6px;padding:6px 2px;border-bottom:0.5px solid #2a2f3a;font-size:13px}
  .crow .arr{color:#5d6675;font-size:11px}
  .crow .rk{width:38px;font-size:10px;color:#8791a3;font-weight:600;flex:none}
  .crow .oz{margin-left:auto;font-weight:700;font-size:14px}
  .crow .pop{font-size:10px;color:#8791a3;width:64px;text-align:right;flex:none}
  .crow .cpr{font-size:10px;color:#8791a3;margin-left:6px;line-height:1.3;flex:none;min-width:58px}
  .crow .cpr .cpop{color:#6b7280}
  .crow .cright{margin-left:auto;display:flex;align-items:center;gap:10px}
  .crow .cright .oz{margin-left:0}
  td .cev{display:block;font-size:9px;color:#5d6675;margin-top:1px}
  td .cev.on{color:#43c59e;font-weight:700}
  .evsum{font-size:11.5px;color:#9aa3b2;margin:2px 0 4px;padding:6px 10px;background:#121722;border:1px solid #232c3c;border-radius:8px;line-height:1.5}
  .evsum b{color:#cfd6e1}
  .evsum .pos{color:#43c59e;font-weight:700}
  .err{margin:14px 0;padding:10px 12px;border:1px solid #5a2a2a;border-radius:8px;background:#231313;
       color:#f0a5a5;font-size:12.5px}
  .note{font-size:11px;color:#7e8796;margin-top:14px;line-height:1.6}
  a.back{color:#8fa8d0;font-size:12.5px;text-decoration:none}
</style>
</head>
<body>
<div id="app">読み込み中…</div>
<script>
(function(){
'use strict';
var LC={1:['#ffffff','#111111'],2:['#1b1b1b','#ffffff'],3:['#e23b3b','#ffffff'],4:['#2f7fd6','#ffffff'],5:['#f2c025','#111111'],6:['#28a35a','#ffffff']};
function chip(n){var a=LC[n]||['#333','#fff'];return '<span class="mc" style="background:'+a[0]+';color:'+a[1]+(n===2?';border:1px solid #3a3f4a':'')+'">'+n+'</span>';}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

var Q=new URLSearchParams(location.search);
var ID=Q.get('id')||'';
var OK=/^\d{12}$/.test(ID);
var JCD=ID.slice(0,2),HD=ID.slice(2,10),RNO=+ID.slice(10,12);
var V=Q.get('v')||'',NO=Q.get('no')||RNO,TM=Q.get('tm')||'';
function combos(k){return (Q.get(k)||'').split(',').filter(function(s){return /^\d(-\d){1,2}$/.test(s);});}
var BF=combos('bf'),B3=combos('b3'),BA=combos('ba');
var SBF={},SB3={},SBA={};BF.forEach(function(c){SBF[c]=1;});B3.forEach(function(c){SB3[c]=1;});BA.forEach(function(c){SBA[c]=1;});
// p=展示反映後の6枠予想確率（betScore）。これで各組の予想率(Plackett-Luce)とEV=予想率×オッズを算出。
var PS=(Q.get('p')||'').split(',').map(Number).filter(function(x){return isFinite(x)&&x>=0;});
var HASP=PS.length===6 && PS.reduce(function(a,b){return a+b;},0)>0;

var o2=null,o2f=null,o3=null,at=null,busy=false,fail=false;

function oddsVal(o,c){var v=o&&o[c];return (v==null||v<=0)?null:v;}
function fmt(v){return v==null?'–':(v>=1000?Math.round(v).toLocaleString():v.toFixed(1));}
// Plackett-Luce（today.html本体 plProbOf と同一）。ps=6枠の予想確率。
function plProbOf(ps,combo){var p=1,rem=0,i;for(i=0;i<ps.length;i++)rem+=ps[i];
  for(i=0;i<combo.length;i++){var w=combo[i];if(rem<=0)return 0;p*=ps[w-1]/rem;rem-=ps[w-1];}return p;}
function pfProb(ps,a,b){return plProbOf(ps,[a,b])+plProbOf(ps,[b,a]);}   // 2連複（順不同）
// 組番文字列→予想率。kind: '3t'(3連単・順序付) / '2t'(2連単・順序付) / '2f'(2連複・順不同)
function probOf(c,kind){
  if(!HASP)return null;
  var a=c.split('-').map(Number);
  if(a.some(function(x){return !(x>=1&&x<=6);}))return null;
  return kind==='2f'?pfProb(PS,a[0],a[1]):plProbOf(PS,a);
}
function evVal(prob,odds){return (prob!=null&&odds!=null)?prob*odds:null;}
function pct(p){return p==null?'–':((p*100>=10?(p*100).toFixed(1):(p*100).toFixed(2)))+'%';}
// EV表示（≥1.00=期待値プラス＝緑★）。EV=予想率×オッズ（1点100円あたりの期待回収倍率）。
function evSpan(ev){
  if(ev==null)return '<span style="font-size:10px;color:#4a5261">EV&nbsp;–</span>';
  var on=ev>=1.0;
  return '<span style="font-size:10.5px;font-weight:'+(on?'700':'400')+';color:'+(on?'#43c59e':'#8791a3')+'">EV&nbsp;'+ev.toFixed(2)+(on?'&#9733;':'')+'</span>';
}
// テーブルセル下段のEV（小さく。≥1.00=緑★）。オッズ/予想率が無ければ空。
function evCell(ev){
  if(ev==null)return HASP?'':'';
  return '<span class="cev'+(ev>=1.0?' on':'')+'">'+ev.toFixed(2)+(ev>=1.0?'&#9733;':'')+'</span>';
}
// 等額で複数点を買ったときの合算EV（＝各点EVの平均）と合計的中率（Σ予想率）。
function groupEV(list,o,kind){
  var evs=[],sp=0,have=0;
  list.forEach(function(c){var pr=probOf(c,kind),v=oddsVal(o,c),ev=evVal(pr,v);
    if(pr!=null)sp+=pr; if(ev!=null){evs.push(ev);have++;}});
  var avg=evs.length?evs.reduce(function(a,b){return a+b;},0)/evs.length:null;
  return {n:list.length,have:have,avg:avg,sumP:HASP?sp:null};
}
// 人気順位マップ {combo:順位}
function rankMap(o){
  if(!o)return {};
  var ks=Object.keys(o).filter(function(k){return o[k]>0;}).sort(function(a,b){return o[a]-o[b];});
  var m={};ks.forEach(function(k,i){m[k]=i+1;});return m;
}

function aiRows(list,o,rmap,lab,cls,sep,kind){
  var h='';
  list.forEach(function(c,i){
    var v=oddsVal(o,c),rk=rmap[c],pr=probOf(c,kind),ev=evVal(pr,v);
    h+='<div class="crow"><span class="rk">'+lab+(list.length>1?(i+1):'')+'</span>'
      +c.split('-').map(chip).join('<span class="arr">'+(sep||'&rarr;')+'</span>')
      +'<span class="cpr">予想 '+pct(pr)+'<br><span class="cpop">'+(rk?rk+'番人気':'–')+'</span></span>'
      +'<span class="cright">'+evSpan(ev)
      +'<span class="oz" style="color:'+cls+'">'+fmt(v)+(v!=null?'<span style="font-size:10px;color:#8791a3">倍</span>':'')+'</span></span></div>';
  });
  return h;
}
// AI買い目グループの合算EVサマリ（買い点数とEVの関係を明示）。
function groupSummary(list,o,kind,name){
  if(!HASP||!list.length)return '';
  var g=groupEV(list,o,kind);
  if(g.have===0)return '<div class="evsum">'+name+'：'+g.n+'点（オッズ未取得のためEVは取得後に表示）</div>';
  var cls=g.avg>=1.0?'pos':'';
  return '<div class="evsum">'+name+' <b>'+g.n+'点</b>一括購入（等額）：'
    +'合算EV <span class="'+cls+'">'+g.avg.toFixed(2)+'</span>'
    +'（＝各点EVの平均）　合計的中率 <b>'+pct(g.sumP)+'</b></div>';
}

function fukuTable(){
  // 2連複15点: 列=小さい方の艇a(1-5)・縦=相手b(a+1..6) の三角表
  var h='<table><tr>';for(var a=1;a<=5;a++)h+='<th>'+chip(a)+'<span style="font-size:9px;color:#5d6675">軸</span></th>';h+='</tr>';
  for(var row=0;row<5;row++){
    h+='<tr>';
    for(var a=1;a<=5;a++){
      var b=a+1+row;
      if(b>6){h+='<td style="border-bottom:0"></td>';continue;}
      var c=a+'-'+b,v=oddsVal(o2f,c),ev=evVal(probOf(c,'2f'),v);
      h+='<td class="'+(SBF[c]?'hl2':(v==null?'na':''))+'"><span class="lane">'+b+'</span>'+fmt(v)+evCell(ev)+'</td>';
    }
    h+='</tr>';
  }
  return h+'</table>';
}

function exTable(){
  // 2連単30点: 列=1着(6艇)・行=2着(残り5艇昇順)
  var h='<table><tr>';for(var a=1;a<=6;a++)h+='<th>'+chip(a)+'<span style="font-size:9px;color:#5d6675">1着</span></th>';h+='</tr>';
  for(var row=0;row<5;row++){
    h+='<tr>';
    for(var a=1;a<=6;a++){
      var others=[1,2,3,4,5,6].filter(function(x){return x!==a;});
      var b=others[row],c=a+'-'+b,v=oddsVal(o2,c),ev=evVal(probOf(c,'2t'),v);
      h+='<td class="'+(v==null?'na':'')+'"><span class="lane">'+b+'</span>'+fmt(v)+evCell(ev)+'</td>';
    }
    h+='</tr>';
  }
  return h+'</table>';
}

function triTable(){
  // 3連単120点: 1着ごとのブロック（行=2着5艇・各行に3着4点）
  var h='';
  for(var a=1;a<=6;a++){
    var others=[1,2,3,4,5,6].filter(function(x){return x!==a;});
    h+='<div class="blk"><div style="font-size:12px;font-weight:600;color:#9aa3b2;margin:2px 0 3px">1着 '+chip(a)+'</div><table><tr><th style="width:34px">2着</th>';
    for(var i=0;i<4;i++)h+='<th>3着</th>';
    h+='</tr>';
    others.forEach(function(b){
      var thirds=others.filter(function(x){return x!==b;});
      h+='<tr><td style="border-bottom:0.5px solid #2a2f3a">'+chip(b)+'</td>';
      thirds.forEach(function(cc){
        var c=a+'-'+b+'-'+cc,v=oddsVal(o3,c),ev=evVal(probOf(c,'3t'),v);
        h+='<td class="'+(SB3[c]?'hl3':(SBA[c]?'hla':(v==null?'na':'')))+'"><span class="lane">'+cc+'</span>'+fmt(v)+evCell(ev)+'</td>';
      });
      h+='</tr>';
    });
    h+='</table></div>';
  }
  return h;
}

function popList(o,n,dim,sep,honSet,kind){
  var ks=Object.keys(o||{}).filter(function(k){return o[k]>0;}).sort(function(a,b){return o[a]-o[b];}).slice(0,n);
  if(!ks.length)return '';
  var h='';
  ks.forEach(function(c,i){
    var mk=(honSet&&honSet[c])?' <span style="font-size:10px;color:#43c59e">AI本線</span>':(SBA[c]?' <span style="font-size:10px;color:#c79bff">AI穴</span>':'');
    var ev=evVal(probOf(c,kind),o[c]);
    h+='<div class="crow"><span class="rk">'+(i+1)+'位</span>'
      +c.split('-').map(chip).join('<span class="arr">'+(sep||'&rarr;')+'</span>')+mk
      +'<span class="cright">'+evSpan(ev)
      +'<span class="oz">'+fmt(o[c])+'<span style="font-size:10px;color:#8791a3">倍</span></span></span></div>';
  });
  return '<div class="sec">'+dim+' 人気順</div>'+h;
}

function render(){
  var app=document.getElementById('app');
  if(!OK){app.innerHTML='<div class="err">レース指定がありません。予想ページ（レース詳細）の「オッズ一覧」ボタンから開いてください。</div>';return;}
  var hd=HD.slice(0,4)+'-'+HD.slice(4,6)+'-'+HD.slice(6,8);
  // 予想へ戻る＝見ていたレース詳細へ直接（このページは別タブ target=_blank/rel=noopener で開くため
  // history.back() は効かない・today.html を素で開くとメイン画面に戻ってしまう）。race=<id> で詳細を復元。
  var backHref=ID?'today.html?race='+encodeURIComponent(ID):'today.html';
  var h='<a class="back" href="'+backHref+'">&lsaquo; 予想へ戻る</a>'
    +'<h1>'+esc(V)+' '+esc(NO)+'R オッズ'
    +'<button class="upbtn" id="upd"'+(busy?' disabled':'')+'>'+(busy?'取得中…':'更新')+'</button></h1>'
    +'<div class="meta">'+hd+(TM?'　締切 '+esc(TM):'')
    +(at?'　<span style="color:#43c59e">'+at+' 取得</span>':'')+'　約2分毎に自動更新</div>';
  if(fail&&!o2&&!o2f&&!o3){
    h+='<div class="err">オッズを取得できませんでした。発売前（オッズ未確定）か、公式サイトが混雑しています。少し待つと自動で再取得します。</div>';
  }
  var rf=rankMap(o2f),r3=rankMap(o3);
  if(BF.length||B3.length||BA.length){
    h+='<div class="sec">AI買い目の実オッズ<span class="kbadge">本線=緑 / 穴予想=紫</span>'
      +(HASP?'<span class="kbadge">予想率・EV付</span>':'')+'</div>';
    if(BF.length){h+=aiRows(BF,o2f,rf,'2複',' #7fe0bf','=','2f');h+=groupSummary(BF,o2f,'2f','2連複 本線');}
    if(B3.length){h+=aiRows(B3,o3,r3,'3連',' #7fe0bf','&rarr;','3t');h+=groupSummary(B3,o3,'3t','3連単 本線');}
    if(BA.length){h+=aiRows(BA,o3,r3,'穴',' #c79bff','&rarr;','3t');h+=groupSummary(BA,o3,'3t','3連単 穴予想');}
  }
  h+=popList(o2f,5,'2連複','=',SBF,'2f')+popList(o3,10,'3連単',null,SB3,'3t');
  h+='<div class="sec">2連複 全15点<span class="kbadge">本線の券種</span><span class="kbadge">下段=EV</span></div>'+fukuTable();
  h+='<div class="sec">2連単 全30点<span class="kbadge">参考（購入対象外）</span><span class="kbadge">下段=EV</span></div>'+exTable();
  h+='<div class="sec">3連単 全120点<span class="kbadge">– は未発売/欠場</span><span class="kbadge">下段=EV</span></div>'+triTable();
  h+='<div class="note">※ 公式サイトのオッズを直接取得（2連複/2連単/3連単・サーバ側90秒キャッシュ）。オッズは締切まで動きます。'
    +'緑=AI本線の買い目（2連複・3連単）、紫=AI穴予想。2連単は市場の堅さ確認用の参考（2026-07-07に本線を2連複へ切替）。「–」は未発売・欠場・取得不可。'
    +(HASP?'<br><b style="color:#9aa3b2">予想率</b>＝AIの各組的中予想（朝＝展示反映後のPlackett-Luce）。<b style="color:#43c59e">EV</b>＝予想率×オッズ＝1点100円あたりの期待回収倍率で、'
      +'<b style="color:#43c59e">1.00★以上が期待値プラス</b>（＝実オッズが必要倍1÷予想率を超えた組）。各セル下段の小数がEV。'
      +'<br>EVは1点ごとに決まる値で<b>買い点数では変わりません</b>。複数点をまとめ買いした「合算EV」は各点EVの平均なので、EV&lt;1.00の目を足すほど下がり、EV≥1.00の目だけに絞るほど上がります（的中率は上がるが期待値は薄まる方向）。'
      :'<br><span style="color:#7e8796">予想率・EVは予想ページのレース詳細「オッズ一覧」ボタンから開くと表示されます。</span>')
    +'</div>';
  app.innerHTML=h;
  var b=document.getElementById('upd');if(b)b.onclick=function(){load(true);};
}

function load(force){
  if(!OK||busy)return;
  busy=true;render();
  var q='jcd='+JCD+'&rno='+RNO+'&hd='+HD;
  Promise.all([
    fetch('/api/odds?'+q,{cache:'no-store'}).then(function(x){return x.ok?x.json():null;}).catch(function(){return null;}),
    fetch('/api/odds?'+q+'&type=3t',{cache:'no-store'}).then(function(x){return x.ok?x.json():null;}).catch(function(){return null;})
  ]).then(function(a){
    var n2=a[0]&&a[0].o2,nf=a[0]&&a[0].o2f,n3=a[1]&&a[1].o3;
    fail=!n2&&!nf&&!n3;
    if(n2)o2=n2;
    if(nf)o2f=nf;
    if(n3)o3=n3;
    if(n2||nf||n3)at=new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    busy=false;render();
  });
}

render();load(true);
setInterval(function(){if(!document.hidden)load(false);},120000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)load(false);});
})();
</script>
</body>
</html>
