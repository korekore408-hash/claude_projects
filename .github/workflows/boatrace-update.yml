name: boatrace-update

# 当日の展示・結果・鉄板EVを「窓取得」で自動収集し、today.html が読む update.json(KV) を更新する。
# 予想は朝の daily で確定済み・ここでは触らない（結果/的中/配当が時間とともに反映される）。
#
# ★なぜ「全日ループ」方式か（16時で更新が止まる問題の恒久対策）:
#   旧設計は `*/30 1-12`（10:00〜21:30 JST を30分毎）だったが、GitHub の schedule は
#   高頻度 cron ほど強く間引かれ、実測では 1日1〜2回（しかも 15:44〜16:56 JST 帯に集中）しか
#   発火していなかった。その「1回」が16時前までの展示を取り込んだ後は二度と走らず、
#   夕方以降（ナイター等）のレースが永久に更新されない＝「16時で止まる」の原因だった。
#   対策: 1回の発火で終わらず、起動したジョブが「発走帯(09:40〜21:40 JST)の間 25分おきに
#   窓取得を繰り返す」ロングラン・ループにする。発火が1日数回でも、各発火が最大5.8時間
#   走り続け、concurrency(直列)の pending 引き継ぎで途切れずにその日を覆う。
#   ※本リポジトリは public＝Actions 実行時間は無料・無制限なので長時間ジョブが可能。
#
# ★起動トリガ（どれか1つでも発火すれば当日を覆える冗長構成）:
#   - workflow_run(boatrace-daily 完了): 朝 daily は毎朝確実に走る＝最も信頼できる朝の種火。
#   - schedule 複数本: 日中〜夜に分散配置。多くは間引かれるが帯ごとに1本でも発火すれば十分。
#   - workflow_dispatch(手動「更新」ボタン): こちらは即時1回だけ取得（ループしない）。
#
# ★KV 即時配信（ビルド枠を消費しない）:
#   ci_update.py が update.json を Cloudflare KV へ PUT。today.html は /api/update(KV) を
#   最優先で読むので git commit 不要＝25分毎でも Cloudflare ビルド枠を一切消費しない。
#   KV 用 Secret(CF_ACCOUNT_ID/CF_KV_NAMESPACE_ID/CF_API_TOKEN) 未設定なら push は no-op。
#   手動ボタン時のみ KV 失敗で commit フォールバック（従来どおり）。
#
# GitHub cron は UTC（00:00 UTC = 09:00 JST）。
on:
  schedule:
    - cron: '17 0 * * *'    # 00:17 UTC = 09:17 JST（発走前の種火①）
    - cron: '17 2 * * *'    # 02:17 UTC = 11:17 JST（日中の種火②）
    - cron: '17 4 * * *'    # 04:17 UTC = 13:17 JST（日中の種火③）
    - cron: '47 6 * * *'    # 06:47 UTC = 15:47 JST（夕方の種火④・実測で最も確実に発火する帯）
    - cron: '17 9 * * *'    # 09:17 UTC = 18:17 JST（夜/ナイターの種火⑤）
  workflow_run:
    workflows: ["boatrace-daily"]
    types: [completed]       # 朝 daily 完了ごとに起動＝朝の確実な種火
  workflow_dispatch:

# 自動起動(schedule/workflow_run)は同一グループで直列化し、ロングランの合間を
# pending 引き継ぎで途切れなく覆う。手動ボタン(workflow_dispatch)は run_id 固有グループで
# 即時・並行に1回だけ走らせる（ループ中でも待たされない）。
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && github.run_id || 'boatrace-update-loop' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350     # GitHub ホストの上限6時間未満。1発火でこの時間ループし続ける。
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4

      - name: compute JST day
        id: day
        run: echo "d=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: boatrace/requirements.txt

      - name: install deps
        run: pip install -r boatrace/requirements.txt

      # daily が保存した派生CSV(予測/特徴量)を取り出す。serve_odds がEV算出に読む。
      # 当日キー優先・無ければ最新の boatrace-derived-* にフォールバック。
      - name: restore derived CSV cache (from daily job)
        id: derived
        uses: actions/cache/restore@v4
        with:
          path: |
            boatrace/predict_win.csv
            boatrace/features_race_relative.csv
            boatrace/features_player_history.csv
          key: boatrace-derived-${{ steps.day.outputs.d }}
          restore-keys: |
            boatrace-derived-

      # cache miss（その日 daily 未実行/cache失効）なら update.json を触らず終了し
      # 前回分を温存（壊さない）。次の daily で cache が再生成され自己修復する。
      - name: guard - skip if derived CSV missing
        id: guard
        working-directory: boatrace
        run: |
          if [ -f predict_win.csv ] && [ -f features_race_relative.csv ] && [ -f features_player_history.csv ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "ok=0" >> "$GITHUB_OUTPUT"
            echo "::warning::derived CSV cache miss — skip update.json (keep previous; next daily self-heals)"
          fi

      # 「取得済み」キャッシュ（data/before/before_YYYYMMDD.json）を当日内で持ち回す。
      # これにより窓取得は「前回以降に窓入りした数レース」だけを取得＝軽量・低負荷。
      - name: restore before-cache (intraday)
        if: steps.guard.outputs.ok == '1'
        uses: actions/cache/restore@v4
        with:
          path: boatrace/data/before
          key: boatrace-before-${{ steps.day.outputs.d }}-${{ github.run_id }}
          restore-keys: |
            boatrace-before-${{ steps.day.outputs.d }}-

      # ── 手動「更新」ボタン: 即時1回だけ取得（ループしない。従来どおりの挙動） ──
      - name: one-shot update (manual button)
        id: oneshot
        if: steps.guard.outputs.ok == '1' && github.event_name == 'workflow_dispatch'
        working-directory: boatrace
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python ci_update.py --window --retries 2

      # ── 自動起動: 発走帯(09:40〜21:40 JST)の間、25分おきに窓取得を繰り返す ──
      # KV へ即時配信。窓外/取得済み/中止場はスキップ＝1回あたり数レースのみ＝軽量。
      # ci_update が失敗しても break せず次の周回で自己回復（25分間隔が過剰アクセスを防ぐ）。
      # timeout(350分)で切れても、concurrency の pending(別の種火)が引き継いで続きを覆う。
      - name: intraday loop (automated seeds)
        if: steps.guard.outputs.ok == '1' && github.event_name != 'workflow_dispatch'
        working-directory: boatrace
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          echo "loop start $(date '+%F %T %Z')  (event=${{ github.event_name }})"
          while :; do
            now=$((10#$(date +%H%M)))      # 10#= 先頭0を10進として解釈（0940→940）
            if [ "$now" -ge 940 ] && [ "$now" -le 2140 ]; then
              python ci_update.py --window || echo "ci_update failed — continue next cycle"
            else
              echo "$(date +%H:%M) 発走帯外 — idle"
            fi
            now=$((10#$(date +%H%M)))
            if [ "$now" -ge 2140 ]; then
              echo "race day end ($(date +%H:%M)) — loop exit"
              break
            fi
            sleep 1500                      # 25分
          done

      # 「取得済み」キャッシュを保存（同じ当日プレフィックスで次の種火/周回が流用）。
      - name: save before-cache (intraday)
        if: steps.guard.outputs.ok == '1' && always()
        uses: actions/cache/save@v4
        with:
          path: boatrace/data/before
          key: boatrace-before-${{ steps.day.outputs.d }}-${{ github.run_id }}

      # commit フォールバック（手動ボタンで KV 未設定/失敗時のみ・従来どおり動く）。
      # 自動ループは KV 配信のみ＝25分毎に commit せず Cloudflare リビルドを起こさない。
      - name: commit & push update.json (manual fallback only)
        if: steps.oneshot.outputs.kv_ok != '1' && github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "boatrace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add boatrace/update.json boatrace/data
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "chore(boatrace): update $(date +%H:%M) JST"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin master && git push origin master && exit 0
            echo "push race, retry $i"; sleep 5
          done
          echo "push failed after retries"; exit 1
