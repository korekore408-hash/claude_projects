name: boatrace-odds

# 毎日1回：前日の「確定オッズ」（3連単120点＋2連単30点・全場全レース）を取得して
# data/odds/odds_YYYYMMDD.csv に保存・commit する。
#
# 目的：モデル予想（predict_win_history.csv・朝に確定）× オッズ × 実結果（K-file）を
# 同じ race_id で突合できるようにし、「model_prob × odds > 1 の組だけ買う(+EV)」戦略が
# 回収率100%を超えられるかを後日バックテスト（backtest_ev.py）で検証するためのログ。
#
# なぜ「前日」か：
#   - 前日なら全レース終了済み＝確定オッズ（＝払戻の基準）が全場そろう。
#   - 当日朝は後半レースが未発売でオッズが歯抜けになる。
#   - 前日の予想は前日朝に predict_win_history.csv へ記録済み（先読みなし）。
#   ＝ model(前日朝) × odds(前日確定) × result(前日) が揃い、+EV検証に過不足ない。
#
# 予想パイプライン（boatrace-daily）とは独立。today.html の朝の生成を遅らせない。
on:
  schedule:
    - cron: '34 1 * * *'    # 01:34 UTC = 翌10:34 JST（前日は確定済み・朝のdailyも一巡後）
    # 同日リトライ：GitHubのcronがドロップしても前日分オッズを取り逃さないための保険。
    # 前日の確定オッズは一日中不変＝いつ取ってもよく、既に取得済みなら即スキップ（冪等）。
    - cron: '22 5 * * *'    # 05:22 UTC = 14:22 JST（朝の取得が飛んだ場合の当日リトライ①）
    - cron: '22 9 * * *'    # 09:22 UTC = 18:22 JST（当日リトライ②）
  workflow_dispatch:
    inputs:
      date:
        description: '取得対象日 YYYY-MM-DD（空＝前日）。過去日の追加取得に使用。'
        required: false
        default: ''

concurrency:
  group: boatrace-odds
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 170    # 全場×全R×2券種の取得は約47分。欠落日のバックフィル(最大3日)を
                            # 1回で取り直せるよう余裕を確保（3日×約47分＜170分、上限6時間未満）。
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: install deps
        run: pip install requests

      # 前日分を取得。加えて直近3日の「未取得/空」の日も取り直す＝欠落の自己修復。
      # ★なぜ空ファイルを残さないか（11-18/11-19 欠落の原因対策）:
      #   GitHub の cron ドリフトで収集が 03時台 JST（公式サイトの夜間メンテ帯）に発火すると
      #   全場が空レスポンス＝0件を数十秒で返す。旧実装はこの0件(ヘッダのみ)CSVを commit し、
      #   次段の skip 判定 `[ -f "$f" ]` がそれを「取得済み」とみなして以降の再取得を全て
      #   スキップ→その日が永久欠落していた。対策は2点:
      #     (1) 0件なら空ファイルを残さない（commit させない）。
      #     (2) skip 判定を「ファイル存在」→「データ行が1行以上」に変更（空は取り直す）。
      #   これで good-hour の後続 run / 翌日のバックフィルが自動で埋め直す（確定オッズは不変）。
      - name: fetch odds (+backfill recent empty/missing days)
        working-directory: boatrace
        run: |
          nonempty() { [ -f "$1" ] && [ "$(wc -l < "$1")" -gt 1 ]; }
          fetch_day() {
            local D="$1" ymd f
            ymd="$(date -d "$D" +%Y%m%d)"
            f="data/odds/odds_${ymd}.csv"
            if nonempty "$f"; then
              echo "already logged: $f ($(($(wc -l < "$f")-1)) rows) — skip"; return 0
            fi
            echo "== fetching odds for $D =="
            python fetch_odds.py --date "$D" || echo "fetch_odds error for $D (continue)"
            if nonempty "$f"; then
              echo "  -> $(($(wc -l < "$f")-1)) rows saved"
            else
              echo "  -> 0 rows (公式サイト夜間メンテ/未掲載の可能性) — 空ファイルは残さず削除"
              rm -f "$f"
            fi
          }
          if [ -n "${{ github.event.inputs.date }}" ]; then
            # 手動指定: その日だけ強制取得（既存が空でも実データでも取り直す）
            D="${{ github.event.inputs.date }}"
            rm -f "data/odds/odds_$(date -d "$D" +%Y%m%d).csv"
            fetch_day "$D"
          else
            # 自動: 前日・前々日・3日前を点検し、未取得/空の日だけ取得
            for n in 1 2 3; do fetch_day "$(date -d "$n days ago" +%Y-%m-%d)"; done
          fi

      - name: commit & push odds log
        run: |
          git config user.name  "boatrace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add boatrace/data/odds
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "chore(boatrace): odds log $(date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin master && git push origin master && exit 0
            echo "push race, retry $i"; sleep 5
          done
          echo "push failed after retries"; exit 1
